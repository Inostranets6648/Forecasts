{% extends "layout.html" %}

{% block title %}
    {{ "Регистрация" if is_register else "Вход" }}
{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-tabs">
        <a href="{{ url_for('login') }}" class="tab-btn {{ 'active' if not is_register else '' }}">Вход</a>
        <a href="{{ url_for('register') }}" class="tab-btn {{ 'active' if is_register else '' }}">Регистрация</a>
    </div>

    <form method="POST" action="{{ url_for('register') if is_register else url_for('login') }}">
        <div class="form-group">
            <label for="username">Имя пользователя</label>
            <input type="text" id="username" name="username" required autofocus autocomplete="username">
        </div>

        <div class="form-group">
            <label for="password">Пароль</label>
            <input type="password" id="password" name="password" required autocomplete="current-password">
        </div>

        {% if is_register %}
        <div class="form-group">
            <label for="confirmation">Повторите пароль</label>
            <input type="password" id="confirmation" name="confirmation" required autocomplete="new-password">
        </div>
        {% endif %}

        <button type="submit" class="submit-btn">
            {{ "Зарегистрироваться" if is_register else "Войти" }}
        </button>
    </form>
</div>
{% endblock %}
